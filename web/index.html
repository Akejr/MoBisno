<!DOCTYPE html>
<html lang="pt-AO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F95901" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MôBisno — Criar Loja Online em Angola | Sites e Lojas Virtuais</title>
    <!-- Esta descrição é a de recurso: a pré-renderização substitui-a por página
         (api/_seo.js). Não promete o que está «Em breve» — o domínio próprio
         estava aqui anunciado como incluído e não se consegue ligar. -->
    <meta name="description" content="Já vende pelo WhatsApp? Crie a sua loja online em Angola e ponha o catálogo num link: preços, stock e encomendas que chegam escritas ao WhatsApp. Sem programar." />
    <meta name="keywords" content="criar loja online angola, loja virtual angola, criar site angola, vender online angola, e-commerce angola, loja online luanda, multicaixa express online, website angola, MôBisno" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mobisno.store/" />
    <meta property="og:title" content="MôBisno — Criar Loja Online em Angola" />
    <meta property="og:description" content="Ponha o seu catálogo num link: preços, stock e encomendas que chegam escritas ao WhatsApp. Lojas online angolanas, sem programar." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mobisno.store/" />
    <meta property="og:site_name" content="MôBisno" />
    <meta property="og:locale" content="pt_AO" />
    <!--
      Arte de partilha, não o logótipo: o `logo-header.png` é estreito e o
      WhatsApp mostrava-o numa miniatura ao lado do texto. As medidas vão
      declaradas porque é por elas que o WhatsApp escolhe o formato do cartão.
      Fonte de verdade das medidas: `src/services/seo.ts` (`PLATFORM_SHARE_*`).
    -->
    <meta property="og:image" content="https://mobisno.store/images/share-2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MôBisno — Criar Loja Online em Angola" />
    <meta name="twitter:description" content="Já vende pelo WhatsApp? Ponha o seu catálogo online, em Angola, sem programar." />
    <meta name="twitter:image" content="https://mobisno.store/images/share-2.jpg" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"MôBisno","url":"https://mobisno.store","logo":"https://mobisno.store/logo-header.png","description":"Plataforma para criar lojas online em Angola.","areaServed":{"@type":"Country","name":"Angola"}}
    </script>
    <!--
      Fontes: um único pedido em vez de seis, e sem bloquear a renderização.
      Seis <link rel="stylesheet"> separados obrigavam o browser a esperar por
      seis respostas antes de pintar o primeiro pixel — o que penaliza o LCP
      (fator de posicionamento) sobretudo em redes móveis lentas.
      `preconnect` abre a ligação a fonts.gstatic.com em antecipação; o padrão
      media="print"/onload aplica a folha só depois de descarregada.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Bebas+Neue&family=Noto+Serif:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Sora:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Bebas+Neue&family=Noto+Serif:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Sora:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap"
      />
    </noscript>
    <!--
      Os icones vao num pedido proprio com `display=block`, e nao `swap`: os
      icones sao ligaduras (`<span>arrow_forward</span>`), e com `swap` o
      primeiro ecra mostrava a palavra «arrow_forward» escrita no botao ate a
      fonte chegar. Com `block` o espaco fica vazio e o icone aparece quando
      estiver pronto — o texto errado nunca e apresentado.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      />
    </noscript>  </head>
  <body class="bg-background text-on-background antialiased overflow-x-hidden">
    <div id="app" class="w-full"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
